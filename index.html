<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FamilyFinance - Personal expense management for couples" />

    <!-- PWA -->
    <link rel="manifest" href="/expensetracker/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FamilyFinance" />
    <link rel="apple-touch-icon" href="/expensetracker/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/expensetracker/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/expensetracker/icons/icon-144.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/expensetracker/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96"   href="/expensetracker/icons/icon-96.png" />

    <title>FamilyFinance</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- GitHub Pages SPA routing fix -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/expensetracker/sw.js')
            .then(function(reg) { 
              console.log('SW registered:', reg.scope); 
              // Check for updates every hour
              setInterval(() => {
                reg.update();
              }, 60 * 60 * 1000);
            })
            .catch(function(err) { console.log('SW failed:', err); });
        });
      }
    </script>
  </body>
</html>
